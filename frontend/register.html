<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | SafetyOS</title><style>body{font:16px system-ui;background:#eef3f8;color:#17263b}main{max-width:480px;margin:40px auto;background:white;padding:24px;border-radius:14px}label{display:block;margin:12px 0}input,select,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #b6c4d4;border-radius:8px}button{background:#075985;color:white}a{color:#075985}</style><main><h1>Register with SafetyOS</h1><p>Ask your institution administrator for your institution ID. All registrations require approval.</p><form id="form"><label>Institution ID<input name="tenantId" required></label><label>Full name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Department<input name="department" required></label><label>Requested role<select name="requestedRole"><option value="user">Staff member</option><option value="supervisor">Supervisor</option><option value="safety_department">Safety officer</option><option value="auditor_officer">Auditor</option></select></label><label>Password (at least 14 characters)<input name="password" type="password" minlength="14" required autocomplete="new-password"></label><button>Submit registration</button></form><p id="status" role="status"></p><a href="/">Return to sign in</a></main><script>const f=document.getElementById('form'),s=document.getElementById('status');f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json();if(!r.ok)throw Error(d.error||'Registration failed');s.textContent=d.message;f.reset()}catch(e){s.textContent=e.message}finally{b.disabled=false}};</script></html>
