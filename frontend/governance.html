<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafetyOS governance</title><style>body{font:16px system-ui;background:#edf3fa;color:#172554;margin:20px}section,article{background:white;padding:16px;margin:12px 0;border-radius:10px}button,select,input{font:inherit;padding:9px;margin:5px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metrics strong{display:block;font-size:32px}@media print{button,a,input,select{display:none}}</style><a href="/">Main workspace</a><h1 id="title">Governance</h1><p id="notice" role="status"></p><button id="refresh">Refresh</button><button onclick="window.print()">Print</button><input id="search" placeholder="Search records"><div id="content"></div><script>
const $=id=>document.getElementById(id),token=sessionStorage.getItem('safetyos_token'),mode=new URLSearchParams(location.search).get('view')||'wallboard';let me,rows=[];async function api(p,o={}){const r=await fetch('/api'+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function notice(e){$('notice').textContent=String(e.message||e)}function button(el,label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>fn().catch(notice);el.append(b)}async function change(u,x){if(!confirm('Apply this account change?'))return;await api('/users/'+u.id,{method:'PATCH',body:JSON.stringify(x)});await load()}function render(){const host=$('content');host.replaceChildren();const q=$('search').value.toLowerCase();for(const u of rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q))){const el=document.createElement('article'),p=document.createElement('pre');p.textContent=mode==='users'?[u.name,u.email,u.department,'Role: '+u.role,'Requested: '+u.requestedRole,'Active: '+u.active,'Pending: '+u.pending].join('\n'):JSON.stringify(u,null,2);el.append(p);if(mode==='users'&&u.id!==me.userId&&!['super_admin','admin'].includes(u.role)&&!['super_admin','admin'].includes(u.requestedRole)){if(u.pending)button(el,'Approve assigned role',()=>change(u,{approve:true}));else{button(el,u.active?'Suspend':'Reactivate',()=>change(u,{active:!u.active}));const s=document.createElement('select');for(const role of ['user','supervisor','safety_department','auditor_officer']){const o=document.createElement('option');o.value=role;o.textContent=role;o.selected=u.role===role;s.append(o)}el.append(s);button(el,'Update role',()=>change(u,{role:s.value}))}}host.append(el)}if(!host.children.length)host.textContent='No records found.'}async function load(){if(mode==='wallboard'){const d=await api('/wallboard/summary');const host=$('content');host.replaceChildren();host.className='metrics';for(const [k,v] of Object.entries(d)){const el=document.createElement('article'),b=document.createElement('strong');el.textContent=k.replaceAll('_',' ');b.textContent=v;el.append(b);host.append(el)}return}rows=mode==='users'?(await api('/users')).users:(await api('/audit-logs')).logs;render()}$('search').oninput=render;$('refresh').onclick=()=>load().catch(notice);(async()=>{try{me=(await api('/auth/me')).user;$('title').textContent=mode==='users'?'Institution user management':mode==='audit'?'Audit activity trail':'Live site wallboard';$('search').hidden=mode==='wallboard';await load();if(mode==='wallboard')setInterval(()=>load().catch(notice),30000)}catch(e){notice(e)}})();
</script></html>
