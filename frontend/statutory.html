<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statutory inspection schedule</title><style>body{font:16px system-ui;background:#eef3fa;color:#172554;margin:20px}form,article{background:white;padding:16px;margin:12px 0;border-radius:10px}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:9px;max-width:95%}button{cursor:pointer}pre{white-space:pre-wrap}</style><a href="/">Main workspace</a><h1>Statutory inspection schedule</h1><p>Recorded completion is not a declaration of legal compliance.</p><p id="notice" role="status"></p><form id="schedule" hidden><label>Site <select name="site_id" id="site" required></select></label><label>Obligation <input name="obligation" required></label><label>Authority <input name="authority" required></label><label>Due date <input type="date" name="due_date" required></label><button>Save schedule</button></form><button id="refresh">Refresh</button><button onclick="window.print()">Print</button><div id="records"></div><script>
const $=id=>document.getElementById(id),token=sessionStorage.getItem('safetyos_token');let role='',inspections=[];async function api(p,o={}){const r=await fetch('/api/v1/auditor'+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function notice(e){$('notice').textContent=String(e.message||e)}async function load(){const d=await api('/statutory-schedule');$('records').replaceChildren();for(const q of d.data){const el=document.createElement('article'),p=document.createElement('pre');p.textContent=[q.site_name,q.obligation,q.authority,'Due: '+String(q.due_date).slice(0,10),q.schedule_status].join('\n');el.append(p);if(!q.completed_at&&['auditor_officer','super_admin'].includes(role)){const s=document.createElement('select');for(const i of inspections.filter(i=>i.site_id===q.site_id&&i.signed_off_at&&i.inspection_type==='STATUTORY_DOSH_OSHA')){const o=document.createElement('option');o.value=i.inspection_id;o.textContent=i.audit_reference_code;s.append(o)}const b=document.createElement('button');b.textContent='Link signed inspection';b.disabled=!s.options.length;b.onclick=async()=>{try{await api('/statutory-schedule/'+q.schedule_id+'/complete',{method:'POST',body:JSON.stringify({inspection_id:s.value})});await load()}catch(e){notice(e)}};el.append(s,b)}$('records').append(el)}}$('refresh').onclick=()=>load().catch(notice);$('schedule').onsubmit=async e=>{e.preventDefault();const f=e.target;try{await api('/statutory-schedule',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});f.reset();await load()}catch(e){notice(e)}};(async()=>{try{const r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Sign in first');role=(await r.json()).user.role;$('schedule').hidden=!['admin','super_admin','safety_department'].includes(role);for(const site of (await api('/sites')).sites){const o=document.createElement('option');o.value=site.site_id;o.textContent=site.site_name;$('site').append(o)}inspections=(await api('/inspections')).data;await load()}catch(e){notice(e)}})();
</script></html>
