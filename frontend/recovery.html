<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SafetyOS | Account recovery</title><style>body{font:16px system-ui;background:#eef3f8;color:#14243b;display:grid;place-items:center;min-height:100vh;margin:0}main{background:white;padding:32px;border-radius:20px;width:min(380px,85vw);box-shadow:0 12px 50px #172c4520}input,button{box-sizing:border-box;width:100%;padding:13px;margin:10px 0;border:1px solid #bbc8d6;border-radius:8px;font:inherit}button{background:#075985;color:white;border:0;cursor:pointer}a{color:#075985}</style><main><small>JEZTECH SAFETYOS</small><h1>Account recovery</h1><form id="form"><label id="label" for="value">Registered email</label><input id="value" type="email" required autocomplete="email"><button>Continue securely</button></form><p id="status" role="status"></p><a href="/">Return to sign in</a></main><script>const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const f=document.getElementById('form'),v=document.getElementById('value'),s=document.getElementById('status');if(token){document.getElementById('label').textContent='New password (at least 14 characters)';v.type='password';v.minLength=14;v.maxLength=72;v.autocomplete='new-password'}f.onsubmit=async e=>{e.preventDefault();const button=f.querySelector('button');button.disabled=true;try{const r=await fetch('/api/recovery/'+(token?'confirm':'request'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(token?{token,password:v.value}:{email:v.value})});const j=await r.json();s.textContent=j.message||j.error||'Request failed';if(r.ok)v.value=''}catch{s.textContent='Connection failed. Try again.'}finally{button.disabled=false}};</script></html>
