<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafetyOS enterprise registers</title><style>body{font:16px system-ui;margin:0;background:#f1f5fa;color:#172554}header{background:#172554;color:white;padding:20px}header a{color:white}main{display:grid;grid-template-columns:250px 1fr;gap:16px;padding:16px}nav,section{background:white;padding:16px;border-radius:12px}button,input,textarea{font:inherit;padding:10px;border:1px solid #ccd6e5;border-radius:6px}button{cursor:pointer;background:#eef4ff;color:#172554}nav button{display:block;width:100%;text-align:left;margin:5px 0}label{display:block;margin:12px 0}textarea{display:block;width:95%;min-height:48px}article{border-top:1px solid #ddd;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}#notice{color:#9a3412}@media(max-width:700px){main{grid-template-columns:1fr}}@media print{nav,form,button,header a{display:none!important}main{display:block}}</style><header><a href="/">← SafetyOS workspace</a><h1>Enterprise safety registers</h1></header><main><nav id="nav"></nav><section><h2 id="title">Select a register</h2><p>Record keeping only. These registers do not authorize work, certify compliance or replace formal safety approvals.</p><p id="notice" role="status"></p><form id="form" hidden></form><button id="print">Print register</button><button id="refresh">Refresh</button><div id="records"></div></section></main><script>
const $=id=>document.getElementById(id);let modules={},current='',canCreate=false;const token=sessionStorage.getItem('safetyos_token');async function api(path,opts={}){const r=await fetch('/api/enterprise/'+path,{...opts,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function label(k){return k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase())}function notice(s){$('notice').textContent=s}async function load(){if(!current)return;const r=await api(current);$('records').replaceChildren();for(const row of r.data){const el=document.createElement('article');el.textContent=row.title+' — '+new Date(row.created_at).toLocaleString()+'\n'+Object.entries(row.details).map(([k,v])=>k+': '+v).join('\n');$('records').append(el)}if(!r.data.length)$('records').textContent='No records yet.'}async function open(k){current=k;$('title').textContent=label(k);$('form').replaceChildren();$('form').hidden=!canCreate;for(const field of modules[k].split('|')){const l=document.createElement('label');l.textContent=field;const t=document.createElement('textarea');t.name=field;t.required=true;t.maxLength=2000;l.append(t);$('form').append(l)}const b=document.createElement('button');b.textContent='Save record';$('form').append(b);await load()}$('form').onsubmit=async e=>{e.preventDefault();try{await api(current,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});e.currentTarget.reset();await load();notice('Record saved')}catch(e){notice(e.message)}};$('print').onclick=()=>window.print();$('refresh').onclick=()=>load().catch(e=>notice(e.message));(async()=>{try{if(!token)throw Error('Sign in from the main workspace first.');const r=await api('modules');modules=r.modules;canCreate=r.canCreate;for(const k of Object.keys(modules)){const b=document.createElement('button');b.textContent=label(k);b.onclick=()=>open(k).catch(e=>notice(e.message));$('nav').append(b)}await open(Object.keys(modules)[0])}catch(e){notice(e.message)}})();
</script></html>
