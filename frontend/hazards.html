<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafetyOS Hazard & CAPA Register</title><style>
body{margin:0;background:#f3f6fa;color:#18283d;font:14px system-ui,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.head,.panel{background:#fff;border:1px solid #e2e9f1;border-radius:12px;padding:18px;margin-bottom:16px}.head{background:#11263f;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 14px}.muted{color:#718096}.head .muted{color:#b6c6d9}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button,button{border:1px solid #d5dfeb;border-radius:8px;padding:9px 12px;background:#fff;cursor:pointer;font:inherit}.tabs button.active,.primary{background:#2563d9;color:#fff;border-color:#2563d9}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}label{display:grid;gap:5px;font-weight:650;font-size:12px}input,select,textarea{padding:10px;border:1px solid #d5dfeb;border-radius:8px;font:inherit;width:100%;box-sizing:border-box}textarea{min-height:72px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8edf3}th{font-size:11px;text-transform:uppercase;color:#6d7c90;background:#f8fafc}.scroll{overflow:auto}.hidden{display:none}.badge{border-radius:20px;padding:3px 8px;background:#edf2f7;font-weight:700}.P0{color:#b42332}.P1{color:#b76a12}.P2{color:#8a6b17}.P3{color:#14815a}.error{color:#b42332}.ok{color:#13764f}@media(max-width:600px){.wrap{margin:10px auto}.head{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap">
<header class="head"><div><h1>JEZTECH SafetyOS</h1><div class="muted">Hazard Register & Corrective Actions</div></div><div id="who">Checking session…</div></header>
<div class="tabs"><button class="active" data-tab="hazards">Hazards</button><button data-tab="actions">Corrective actions</button><button onclick="location.href='/'">← Main SafetyOS</button></div>
<section class="panel" id="hazards"><h2>Register a hazard</h2><form id="hazardForm" class="grid">
<label>Reference code<input name="reference_code" required placeholder="HAZ-2026-0001"></label><label>Title<input name="title" required></label><label>Category<input name="hazard_category" required placeholder="Mechanical, chemical, fire…"></label><label>Site ID (optional)<input name="site_id" placeholder="UUID"></label><label>Severity (1–5)<input type="number" name="severity" min="1" max="5" value="3" required></label><label>Likelihood (1–5)<input type="number" name="likelihood" min="1" max="5" value="3" required></label><label>Regulatory impact (1–5)<input type="number" name="regulatory_impact" min="1" max="5" value="3" required></label><label>Business impact (1–5)<input type="number" name="business_impact" min="1" max="5" value="3" required></label><label class="wide">Description<textarea name="description" required></textarea></label><label class="wide">Control measures (one per line)<textarea name="control_measures"></textarea></label><label>Owner user ID (optional)<input name="owner_user_id" placeholder="UUID"></label><div style="align-self:end"><button class="primary">Save hazard</button></div></form><p id="hazardMsg"></p><h2>Hazard register</h2><div class="scroll" id="hazardTable">Loading…</div></section>
<section class="panel hidden" id="actions"><h2>Assign corrective action</h2><form id="actionForm" class="grid"><label>Reference code<input name="reference_code" required placeholder="CAPA-2026-0001"></label><label>Title<input name="title" required></label><label>Linked hazard ID<input name="hazard_id" placeholder="Hazard UUID"></label><label>Linked incident ID<input name="incident_id" placeholder="Incident UUID"></label><label>Assigned user ID<input name="assigned_to" required placeholder="User UUID"></label><label>Due date<input type="date" name="due_date" required></label><label>Priority<select name="priority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></label><label class="wide">Description<textarea name="description" required></textarea></label><div><button class="primary">Create action</button></div></form><p id="actionMsg"></p><h2>Corrective action tracker</h2><div class="scroll" id="actionTable">Loading…</div></section><p id="notice" class="muted"></p></div>
<script>
const $=s=>document.querySelector(s),token=sessionStorage.getItem('safetyos_token');async function api(p,o={}){const r=await fetch('/api/v1/safety'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function obj(f){return Object.fromEntries(new FormData(f).entries())}function table(rows,cols){if(!rows.length)return '<p class="muted">No records found.</p>';return '<table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+String(r[c[0]]??'—').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}async function load(){if(!token){$('#who').textContent='Sign in from main app first';$('#notice').textContent='No SafetyOS session found. Sign in on the main application, then return here.';return}try{const [h,a]=await Promise.all([api('/hazards'),api('/corrective-actions')]);$('#hazardTable').innerHTML=table(h.data||[],[['reference_code','Reference'],['title','Hazard'],['hazard_category','Category'],['risk_score','Risk score'],['priority','Priority'],['status','Status']]);$('#actionTable').innerHTML=table(a.data||[],[['reference_code','Reference'],['title','Action'],['assignee_name','Assigned to'],['due_date','Due'],['priority','Priority'],['status','Status']]);$('#who').textContent='Authenticated workspace'}catch(e){$('#notice').className='error';$('#notice').textContent=e.message}}
$('#hazardForm').onsubmit=async e=>{e.preventDefault();let x=obj(e.currentTarget);for(const k of ['severity','likelihood','regulatory_impact','business_impact'])x[k]=Number(x[k]);for(const k of ['site_id','owner_user_id'])if(!x[k])delete x[k];x.control_measures=x.control_measures.split('\n').map(s=>s.trim()).filter(Boolean);try{await api('/hazards',{method:'POST',body:JSON.stringify(x)});$('#hazardMsg').className='ok';$('#hazardMsg').textContent='Hazard saved.';e.currentTarget.reset();await load()}catch(err){$('#hazardMsg').className='error';$('#hazardMsg').textContent=err.message}};
$('#actionForm').onsubmit=async e=>{e.preventDefault();let x=obj(e.currentTarget);for(const k of ['hazard_id','incident_id'])if(!x[k])delete x[k];try{await api('/corrective-actions',{method:'POST',body:JSON.stringify(x)});$('#actionMsg').className='ok';$('#actionMsg').textContent='Corrective action assigned.';e.currentTarget.reset();await load()}catch(err){$('#actionMsg').className='error';$('#actionMsg').textContent=err.message}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('#hazards').classList.toggle('hidden',b.dataset.tab!=='hazards');$('#actions').classList.toggle('hidden',b.dataset.tab!=='actions')});load();
</script></body></html>
