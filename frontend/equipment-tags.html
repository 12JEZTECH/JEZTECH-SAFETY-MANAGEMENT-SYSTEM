<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment tags</title><style>body{font:16px system-ui;background:#eef3fa;color:#172554;margin:20px}form,section{background:white;padding:16px;margin:12px 0;border-radius:10px}label{display:block;margin:10px 0}input,select,textarea,button{font:inherit;padding:9px;max-width:95%}textarea{width:95%}video{max-width:100%;width:400px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><a href="/">Main workspace</a><h1>Equipment identification</h1><p id="notice" role="status"></p><form id="generate"><label>Site<select id="site" name="site_id" required></select></label><label>Asset code<input name="asset_code" required></label><label>Department<input name="inspected_department" required></label><label>Inspection type<select name="inspection_type"><option>MACHINE_GUARDING_LOTO</option><option>STATUTORY_DOSH_OSHA</option><option>FIRE_ELECTRICAL_AUDIT</option><option>CHEMICAL_HAZMAT_STORAGE</option><option>ISO_45001_SURVEILLANCE</option></select></label><button>Generate signed tag payload</button></form><section><label>Signed tag payload<textarea id="payload"></textarea></label><button id="resolve">Resolve tag</button><button id="copy">Copy payload</button><button id="scan">Scan QR using camera</button><button id="stop">Stop camera</button><video id="video" playsinline muted></video><pre id="result"></pre></section><script>
const $=id=>document.getElementById(id),token=sessionStorage.getItem('safetyos_token');let stream=null,timer=null;function notice(e){$('notice').textContent=String(e.message||e)}async function api(p,x){const r=await fetch('/api/v1/auditor'+p,{method:x?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(x?{body:JSON.stringify(x)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function resolve(){const d=await api('/equipment-tags/resolve',{qrPayload:$('payload').value.trim()});$('result').textContent=JSON.stringify(d.tag,null,2)}function stop(){clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null}$('stop').onclick=stop;window.addEventListener('pagehide',stop);$('resolve').onclick=()=>resolve().catch(notice);$('copy').onclick=()=>navigator.clipboard.writeText($('payload').value).then(()=>notice('Copied')).catch(notice);$('generate').onsubmit=async e=>{e.preventDefault();try{const d=await api('/equipment-tags/generate',Object.fromEntries(new FormData(e.target)));$('payload').value=d.qrPayload;$('result').textContent=JSON.stringify(d.tag,null,2);notice('Signed payload generated')}catch(e){notice(e)}};$('scan').onclick=async()=>{try{stop();if(!('BarcodeDetector' in window))throw Error('Camera QR detection is unsupported in this browser. Paste the signed payload instead.');const detector=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;await $('video').play();let busy=false;timer=setInterval(async()=>{if(busy)return;busy=true;try{const codes=await detector.detect($('video'));if(codes.length){$('payload').value=codes[0].rawValue;stop();await resolve()}}catch(e){stop();notice(e)}finally{busy=false}},400)}catch(e){stop();notice(e)}};(async()=>{try{for(const s of (await api('/sites')).sites){const o=document.createElement('option');o.value=s.site_id;o.textContent=s.site_name;$('site').append(o)}}catch(e){notice(e)}})();
</script></html>
