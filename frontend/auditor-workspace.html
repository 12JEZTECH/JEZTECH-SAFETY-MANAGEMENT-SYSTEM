<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditor workspace</title><style>body{font:16px system-ui;background:#eef3f9;color:#172554;margin:20px}section{background:white;padding:16px;margin:12px 0;border-radius:10px}button,select,input,textarea{font:inherit;padding:9px;margin:5px;max-width:95%}label{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}</style><a href="/">Main workspace</a><h1>Auditor workspace</h1><p id="notice" role="status"></p><section><label>Inspection <select id="inspection"></select></label><button id="refresh">Refresh</button><button id="pdf">Download inspection PDF</button><pre id="summary"></pre></section><section id="findingForm" hidden><h2>Add finding</h2><form id="finding"><label>Clause / area<input name="clause_or_area" required></label><label>Compliance<select name="compliance_status"><option>CONFORMING</option><option>OBSERVATION</option><option>MINOR_NC</option><option>MAJOR_NC</option></select></label><label>Comments<textarea name="auditor_comments" required></textarea></label><label>Corrective action<textarea name="recommended_corrective_action"></textarea></label><button>Save finding</button></form></section><section><h2>Findings and remediation</h2><div id="findings"></div></section><section id="signoff" hidden><h2>Inspection sign-off</h2><form id="sign"><label>Score<input type="number" min="0" max="100" name="overall_compliance_score" required></label><label>Verdict<select name="overall_verdict"><option>SATISFACTORY</option><option>CONDITIONAL_PASS</option><option>IMMEDIATE_ACTION_REQUIRED</option></select></label><label>Summary<textarea name="executive_summary_comments" required></textarea></label><button>Sign off inspection</button></form></section><script>
const $=id=>document.getElementById(id),token=sessionStorage.getItem('safetyos_token');let role='',id='';async function api(p,o={}){const r=await fetch('/api'+p,{...o,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'Request failed')}return r.json()}function notice(e){$('notice').textContent=String(e.message||e)}function post(p,x){return api('/v1/auditor'+p,{method:'POST',body:JSON.stringify(x)})}function button(parent,label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>fn().catch(notice);parent.append(b)}async function load(){id=$('inspection').value;if(!id)return;const d=await api('/v1/auditor/inspections/'+id);$('summary').textContent=JSON.stringify(d.inspection,null,2);$('findingForm').hidden=!!d.inspection.signed_off_at||!['auditor_officer','super_admin','safety_department'].includes(role);$('signoff').hidden=!!d.inspection.signed_off_at||!['auditor_officer','super_admin'].includes(role);$('findings').replaceChildren();for(const f of d.findings){const el=document.createElement('section'),p=document.createElement('pre');p.textContent=JSON.stringify(f,null,2);el.append(p);if(['admin','safety_department','super_admin'].includes(role))button(el,'Management response',async()=>{const response_text=prompt('Management response');if(!response_text)return;const evidence_reference=prompt('Evidence reference')||'';await post('/findings/'+f.finding_id+'/management-response',{response_text,evidence_reference});notice('Response saved');await load()});if(['auditor_officer','super_admin'].includes(role))for(const verified of [true,false])button(el,verified?'Verify closure':'Reject closure',async()=>{const verification_comments=prompt('Verification comments');if(!verification_comments)return;await post('/findings/'+f.finding_id+'/verify-closure',{verified,verification_comments});notice('Verification recorded');await load()});$('findings').append(el)}}$('inspection').onchange=()=>load().catch(notice);$('refresh').onclick=()=>load().catch(notice);$('finding').onsubmit=async e=>{e.preventDefault();try{await post('/inspections/'+id+'/findings',Object.fromEntries(new FormData(e.currentTarget)));e.target.reset();await load()}catch(e){notice(e)}};$('sign').onsubmit=async e=>{e.preventDefault();if(!confirm('Sign off this inspection?'))return;try{const x=Object.fromEntries(new FormData(e.currentTarget));x.overall_compliance_score=Number(x.overall_compliance_score);await post('/inspections/'+id+'/signoff',x);await load()}catch(e){notice(e)}};$('pdf').onclick=async()=>{try{const r=await fetch('/api/v1/auditor/inspections/'+id+'/pdf',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('PDF unavailable');const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download='inspection-'+id+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){notice(e)}};(async()=>{try{role=(await api('/auth/me')).user.role;const r=await api('/v1/auditor/inspections');for(const i of r.data){const o=document.createElement('option');o.value=i.inspection_id;o.textContent=i.audit_reference_code;$('inspection').append(o)}await load()}catch(e){notice(e)}})();
</script></html>
