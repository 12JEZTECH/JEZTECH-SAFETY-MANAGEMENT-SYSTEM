<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafetyOS Print Centre</title><style>body{font:15px system-ui;background:#edf2f7;color:#172b45;margin:0}header{background:#10243c;color:white;padding:20px}header a{color:white}main{max-width:1200px;margin:auto;padding:20px}section,article{background:white;border-radius:12px;padding:20px;margin-bottom:16px}button,input,select{font:inherit;padding:10px;margin:5px;border:1px solid #b9c7d5;border-radius:6px}button{background:#075985;color:white;cursor:pointer}article{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:8px;border:1px solid #ccd5df;text-align:left;overflow-wrap:anywhere}th{background:#e8eef5}footer{margin-top:40px;display:flex;justify-content:space-between}@page{size:A4 landscape;margin:12mm}@media print{header,section{display:none}body,article{background:white;margin:0;padding:0}main{padding:0}article{overflow:visible}thead{display:table-header-group}tr{break-inside:avoid}footer{break-inside:avoid}}</style><header><a href="/">Main workspace</a><h1>SafetyOS Print Centre</h1></header><main><section><form id="filters"><label>Report <select name="kind"><option value="inspections">Safety inspections</option><option value="findings">Audit findings</option><option value="actions">Corrective actions</option><option value="visitors">Visitor and contractor register</option></select></label><label>From <input type="date" name="from" required></label><label>To <input type="date" name="to" required></label><button>Generate preview</button></form><button id="print" disabled>Print / Save PDF</button><button id="csv" disabled>Export CSV</button><p id="status" role="status"></p></section><article><h2 id="org">Report preview</h2><h3 id="title"></h3><p id="period"></p><table id="table"></table><footer><span>Prepared by: __________________</span><span>Approved by: __________________</span></footer></article></main><script>const $=id=>document.getElementById(id),f=$('filters');let data=null;const today=new Date();f.elements.to.value=today.toISOString().slice(0,10);f.elements.from.value=today.toISOString().slice(0,7)+'-01';f.onsubmit=async e=>{e.preventDefault();data=null;$('print').disabled=$('csv').disabled=true;$('table').replaceChildren();try{const token=sessionStorage.getItem('safetyos_token')||localStorage.getItem('safetyos_token');const q=new URLSearchParams({from:f.elements.from.value,to:f.elements.to.value});const r=await fetch('/api/v1/reports/print/'+f.elements.kind.value+'?'+q,{headers:{Authorization:'Bearer '+(token||'')}});const d=await r.json();if(!r.ok)throw Error(d.error||'Report failed');data=d;$('org').textContent=d.organization.organization_name;$('title').textContent=f.elements.kind.selectedOptions[0].textContent;$('period').textContent=d.from+' to '+d.to+' | '+d.rows.length+' records'+(d.truncated?' | TRUNCATED: narrow date range':'');const head=$('table').createTHead().insertRow();for(const k of d.columns){const th=document.createElement('th');th.textContent=k.replaceAll('_',' ');head.append(th)}const body=$('table').createTBody();for(const row of d.rows){const tr=body.insertRow();for(const k of d.columns)tr.insertCell().textContent=row[k]??''}$('print').disabled=$('csv').disabled=d.truncated;$('status').textContent=d.truncated?'Narrow the date range before exporting.':'Report ready'}catch(e){$('status').textContent=e.message}};$('print').onclick=()=>{if(data&&!data.truncated)window.print()};$('csv').onclick=()=>{if(!data||data.truncated)return;const quote=v=>{let s=String(v??'');if(/^[\s]*[=+@-]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const csv=[data.columns,...data.rows.map(r=>data.columns.map(k=>r[k]))].map(r=>r.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='safetyos-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
