<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafetyOS Administration</title><style>:root{font:15px system-ui;color:#172b45;background:#f1f5f9}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#10243c;color:white;padding:24px}aside a{display:block;color:#cfe3f6;padding:12px;text-decoration:none}main{padding:24px;min-width:0}section{background:white;border:1px solid #dbe4ed;border-radius:14px;padding:20px;margin:16px 0;overflow:auto}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{background:#fff;border-radius:12px;padding:18px}.metric strong{display:block;font-size:28px}input,select,button,textarea{font:inherit;padding:10px;border:1px solid #bac8d8;border-radius:8px;margin:5px;max-width:100%}button{background:#0369a1;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0}@media(max-width:700px){body{display:block}aside{padding:12px}aside a{display:inline-block}main{padding:12px}}</style><aside><h2>SafetyOS</h2><a href="/">Main workspace</a><a href="#plans">Pricing</a><a href="#clients">Clients</a><a href="#backups">Backups</a><a href="#support">Consultation</a></aside><main><h1>Administration centre</h1><p id="status" role="status"></p><div class="metrics" id="metrics"></div><section id="plans"><h2>Subscription plans</h2><form id="plan"><input name="name" placeholder="Plan name" required><input name="monthly_price" type="number" min="0" step=".01" placeholder="Monthly KES" required><input name="trial_days" type="number" min="0" max="365" value="30" required><button>Save plan</button></form><div id="planlist"></div></section><section id="clients"><h2>Client subscriptions</h2><form id="sub"><select name="tenant_id" required></select><select name="plan_id" required></select><input name="days" type="number" min="1" max="366" value="30" required><label><input name="trial" type="checkbox">Trial</label><button>Create subscription</button></form><div id="clientlist"></div></section><section id="backups"><h2>Backup history</h2><div id="backuplist"></div></section><section id="support"><h2>Consultation and support</h2><form id="ticket"><select name="kind"><option>CONSULTATION</option><option>SUPPORT</option></select><input name="subject" required placeholder="Subject"><textarea name="message" required placeholder="Describe your request"></textarea><button>Submit request</button></form><div id="tickets"></div></section></main><script>const $=id=>document.getElementById(id),token=sessionStorage.getItem('safetyos_token')||localStorage.getItem('safetyos_token');async function api(path,body){const r=await fetch('/api/administration/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+(token||''),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function table(id,headers,rows){const t=document.createElement('table');for(const row of [headers,...rows]){const tr=t.insertRow();for(const val of row){const cell=tr.insertCell();cell.textContent=val??'—'}}$(id).replaceChildren(t)}function options(el,rows,key,label){el.replaceChildren(...rows.map(r=>{const o=document.createElement('option');o.value=r[key];o.textContent=r[label];return o}))}async function load(){try{const p=await api('plans');table('planlist',['Plan','Monthly KES','Trial days'],p.map(x=>[x.name,x.monthly_price,x.trial_days]));options($('sub').elements.plan_id,p,'plan_id','name');const tickets=await api('support');table('tickets',['Subject','Type','Status'],tickets.map(x=>[x.subject,x.kind,x.status]));const d=await api('dashboard');options($('sub').elements.tenant_id,d.clients,'tenant_id','organization_name');table('clientlist',['Client','Status','Subscriptions','Invoices','Verified payments KES'],d.clients.map(x=>[x.organization_name,x.status,x.subscriptions.length,x.invoices.length,x.payments.filter(p=>p.status==='VERIFIED').reduce((a,p)=>a+Number(p.amount),0)]));table('backuplist',['Status','Started','Completed','Bytes'],d.backups.map(x=>[x.status,x.started_at,x.completed_at,x.size_bytes]));$('metrics').replaceChildren(...[['Clients',d.clients.length],['Subscriptions',d.clients.reduce((a,x)=>a+x.subscriptions.length,0)],['Verified payments KES',d.clients.flatMap(x=>x.payments).filter(x=>x.status==='VERIFIED').reduce((a,x)=>a+Number(x.amount),0)]].map(([k,v])=>{const n=document.createElement('div');n.className='metric';const s=document.createElement('strong');s.textContent=v;n.append(s,k);return n}));$('status').textContent='Connected'}catch(e){$('status').textContent=e.message}}for(const [id,path] of [['plan','plans'],['sub','subscriptions'],['ticket','support']])$(id).onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const k of ['monthly_price','trial_days','days'])if(k in data)data[k]=Number(data[k]);if(id==='sub')data.trial=e.target.elements.trial.checked;try{await api(path,data);await load()}catch(e){$('status').textContent=e.message}};load();</script></html>
