services:
  - type: web
    name: jeztech-safetyos
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: jeztech-safetyos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://jeztech-safetyos.onrender.com
      - key: BOOTSTRAP_TENANT_NAME
        value: JEZTECH SafetyOS
      - key: BOOTSTRAP_ADMIN_NAME
        value: SafetyOS Super Admin
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
databases:
  - name: jeztech-safetyos-db
    plan: basic-1gb
    databaseName: jeztech_safetyos
    user: safetyos_app
